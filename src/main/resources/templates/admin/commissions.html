<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chính Sách Hoa Hồng - Duy Truong Motor Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261028_final')}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-gold text-decoration-none small d-inline-block mb-1"><i class="fa-solid fa-arrow-left me-1"></i> Trở về Dashboard Admin</a>
                <h3 class="fw-bold text-white mb-0"><i class="fa-solid fa-percent text-gold me-2"></i> QUẢN LÝ CHÍNH SÁCH HOA HỒNG SÀN (COMMISSIONS)</h3>
            </div>
        </div>

        <div class="glass-panel p-4 rounded-4">
            <div class="table-responsive">
                <table class="table table-dark table-borderless align-middle mb-0">
                    <thead>
                        <tr class="border-bottom border-secondary text-gold small">
                            <th>GÓI HOA HỒNG</th>
                            <th>TỶ LỆ CHIẾT KHẤU SÀN (%)</th>
                            <th>MÔ TẢ CHI TIẾT</th>
                            <th>TRẠNG THÁI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-bottom border-secondary" th:each="c : ${commissions}">
                            <td><strong class="text-white" th:text="${c.name}"></strong></td>
                            <td><span class="fs-5 fw-bold text-gradient-gold" th:text="${c.cost} + '%'"></span></td>
                            <td class="text-secondary small" th:text="${c.description}"></td>
                            <td><span class="badge bg-success">Đang Áp Dụng</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
