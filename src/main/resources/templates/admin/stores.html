<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấp Phép Showroom - Duy Truong Moto Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-gold text-decoration-none small d-inline-block mb-1"><i class="fa-solid fa-arrow-left me-1"></i> Trở về Dashboard Admin</a>
                <h3 class="fw-bold text-white mb-0"><i class="fa-solid fa-store text-gold me-2"></i> QUẢN LÝ & CẤP PHÉP CHUỖI SHOWROOM CHI NHÁNH</h3>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show bg-success text-white border-0 rounded-4 shadow">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <div class="glass-panel p-4 rounded-4">
            <div class="table-responsive">
                <table class="table table-dark table-borderless align-middle mb-0">
                    <thead>
                        <tr class="border-bottom border-secondary text-secondary small">
                            <th>SHOWROOM</th>
                            <th>CHỦ SỞ HỮU</th>
                            <th>ĐỊA CHỈ</th>
                            <th>HOTLINE</th>
                            <th>HOA HỒNG SÀN</th>
                            <th>TRẠNG THÁI HOẠT ĐỘNG</th>
                            <th>THAO TÁC CẤP PHÉP</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-bottom border-secondary" th:each="st : ${stores}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <img th:src="${st.avatar}" class="rounded-circle border border-gold" style="width: 45px; height: 45px; object-fit: cover;">
                                    <div>
                                        <strong class="text-white d-block" th:text="${st.name}"></strong>
                                        <span class="text-secondary small" th:text="${st.slug}"></span>
                                    </div>
                                </div>
                            </td>
                            <td class="text-white small" th:text="${st.owner.getFullName()}"></td>
                            <td class="text-secondary small" style="max-width: 250px;" th:text="${st.address}"></td>
                            <td class="text-gold small fw-bold" th:text="${st.phone}"></td>
                            <td>
                                <span class="badge bg-dark border border-secondary text-warning" th:text="${st.commission != null ? st.commission.cost + '%' : '5.0%'}"></span>
                            </td>
                            <td>
                                <span th:if="${st.isActive}" class="badge bg-success">Đã Cấp Phép</span>
                                <span th:if="${!st.isActive}" class="badge bg-danger">Bị Tạm Khóa</span>
                            </td>
                            <td>
                                <form th:action="@{/admin/stores/{id}/toggle(id=${st.id})}" method="post">
                                    <input type="hidden" name="isActive" th:value="${!st.isActive}">
                                    <button type="submit" class="btn btn-sm rounded-pill px-3" 
                                            th:classappend="${st.isActive ? 'btn-outline-danger' : 'btn-outline-success'}"
                                            th:text="${st.isActive ? 'Khóa Cửa Hàng' : 'Cấp Phép Ngay'}">
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
