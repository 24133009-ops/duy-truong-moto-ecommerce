<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Vị Vận Chuyển - Duy Truong Motor Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-gold text-decoration-none small d-inline-block mb-1">
                    <i class="fa-solid fa-arrow-left me-1"></i> Trở về Dashboard Admin
                </a>
                <h3 class="fw-bold text-white mb-0"><i class="fa-solid fa-truck-fast text-gold me-2"></i> QUẢN TRỊ ĐƠN
                    VỊ VẬN CHUYỂN &amp; GIAO XE</h3>
                <p class="text-secondary small">Quản lý các hình thức bàn giao xe sàn trượt VIP, xe tải thùng kín và
                    chuyển phát nhanh phụ tùng.</p>
            </div>
            <button class="btn btn-gold fw-bold" data-bs-toggle="modal" data-bs-target="#newDeliveryModal">
                <i class="fa-solid fa-plus me-1"></i> Thêm Phương Thức Giao Hàng
            </button>
        </div>

        <div th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show bg-success text-white border-0 rounded-4 shadow">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}"
            class="alert alert-danger alert-dismissible fade show bg-danger text-white border-0 rounded-4 shadow">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <div class="glass-panel p-4 rounded-4 shadow">
            <div class="table-responsive">
                <table class="table table-dark table-borderless align-middle mb-0">
                    <thead>
                        <tr class="border-bottom border-secondary text-gold small">
                            <th>ID</th>
                            <th>HÌNH THỨC VẬN CHUYỂN</th>
                            <th>MÔ TẢ CHI TIẾT</th>
                            <th>CƯỚC PHÍ BÀN GIAO</th>
                            <th>TRẠNG THÁI</th>
                            <th>THAO TÁC</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-bottom border-secondary" th:each="d : ${deliveries}">
                            <td class="text-secondary small" th:text="'#' + ${d.id}"></td>
                            <td>
                                <strong class="text-white d-block" th:text="${d.name}"></strong>
                            </td>
                            <td class="text-secondary small" style="max-width: 380px;" th:text="${d.description}"></td>
                            <td>
                                <strong class="text-gradient-gold fs-6"
                                    th:text="${#numbers.formatDecimal(d.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong>
                            </td>
                            <td>
                                <span class="badge bg-success">Đang Cung Cấp</span>
                            </td>
                            <td>
                                <form th:action="@{'/admin/deliveries/' + ${d.id} + '/delete'}" method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('Bạn có chắc chắn muốn xóa phương thức vận chuyển này?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm p-1"
                                        title="Xóa phương thức">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Delivery -->
    <div class="modal fade" id="newDeliveryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-panel border border-secondary text-white p-3 rounded-4">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-gold"><i class="fa-solid fa-plus-circle me-2"></i> THÊM HÌNH
                        THỨC VẬN TẢI</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/deliveries/new}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Tên Hình Thức Vận Chuyển</label>
                            <input type="text" name="name" class="form-control form-control-luxury"
                                placeholder="Ví dụ: Xe cứu hộ sàn trượt thủy lực VIP" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Mô Tả Quy Cách Bàn Giao</label>
                            <textarea name="description" rows="3" class="form-control form-control-luxury"
                                placeholder="Xe sàn hạ sát mặt đất 100%, bảo hiểm thân vỏ toàn phần"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Cước Phí Vận Chuyển (VNĐ)</label>
                            <input type="number" name="price" class="form-control form-control-luxury fw-bold text-gold"
                                placeholder="Ví dụ: 1500000" required>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-gold fw-bold"><i class="fa-solid fa-save me-1"></i> Lưu
                            Phương Thức</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
