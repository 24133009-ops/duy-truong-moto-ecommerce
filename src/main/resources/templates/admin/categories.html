<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Mục - Duy Truong Motor Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-gold text-decoration-none small d-inline-block mb-1"><i class="fa-solid fa-arrow-left me-1"></i> Trở về Dashboard Admin</a>
                <h3 class="fw-bold text-white mb-0"><i class="fa-solid fa-layer-group text-gold me-2"></i> QUẢN LÝ DANH MỤC XE & PHỤ KIỆN</h3>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show bg-success text-white border-0 rounded-4 shadow">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="glass-panel p-4 rounded-4">
                    <h5 class="fw-bold text-gold mb-3">DANH SÁCH DANH MỤC HIỆN TẠI</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-borderless align-middle mb-0">
                            <thead>
                                <tr class="border-bottom border-secondary text-gold small">
                                    <th>ID</th>
                                    <th>TÊN DANH MỤC</th>
                                    <th>ĐƯỜNG DẪN (SLUG)</th>
                                    <th>TRẠNG THÁI</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="border-bottom border-secondary" th:each="c : ${categories}">
                                    <td class="text-secondary small" th:text="'#' + ${c.id}"></td>
                                    <td><strong class="text-white" th:text="${c.name}"></strong></td>
                                    <td class="text-gold small" th:text="${c.slug}"></td>
                                    <td><span class="badge bg-success">Đang Hoạt Động</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="glass-panel p-4 rounded-4">
                    <h5 class="fw-bold text-gold mb-3"><i class="fa-solid fa-plus me-1"></i> THÊM DANH MỤC MỚI</h5>
                    <form th:action="@{/admin/categories/new}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Tên Danh Mục</label>
                            <input type="text" name="name" class="form-control form-control-luxury" placeholder="Ví dụ: Xe Đua Track-Only" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-light small fw-bold">Đường dẫn Slug</label>
                            <input type="text" name="slug" class="form-control form-control-luxury" placeholder="xe-dua-track-only" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100 py-2 fw-bold">TẠO DANH MỤC</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
