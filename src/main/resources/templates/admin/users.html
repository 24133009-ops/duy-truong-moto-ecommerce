<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng - Duy Truong Moto Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/dashboard}" class="text-gold text-decoration-none small d-inline-block mb-1"><i class="fa-solid fa-arrow-left me-1"></i> Trở về Dashboard Admin</a>
                <h3 class="fw-bold text-white mb-0"><i class="fa-solid fa-users text-gold me-2"></i> QUẢN TRỊ NGƯỜI DÙNG TOÀN HỆ THỐNG</h3>
            </div>
            <span class="badge bg-gold text-dark fs-6" th:text="${#lists.size(users)} + ' Thành viên'"></span>
        </div>

        <div class="glass-panel p-4 rounded-4">
            <div class="table-responsive">
                <table class="table table-dark table-borderless align-middle mb-0">
                    <thead>
                        <tr class="border-bottom border-secondary text-secondary small">
                            <th>ID</th>
                            <th>HỌ VÀ TÊN</th>
                            <th>EMAIL</th>
                            <th>SỐ ĐIỆN THOẠI</th>
                            <th>VAI TRÒ (ROLE)</th>
                            <th>KÍCH HOẠT OTP</th>
                            <th>ĐIỂM THÀNH VIÊN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-bottom border-secondary" th:each="u : ${users}">
                            <td class="text-secondary small" th:text="'#' + ${u.id}"></td>
                            <td>
                                <strong class="text-white" th:text="${u.getFullName()}"></strong>
                            </td>
                            <td class="text-gold small" th:text="${u.email}"></td>
                            <td class="text-secondary small" th:text="${u.phone}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${u.role.name() == 'ROLE_ADMIN' ? 'bg-danger' : (u.role.name() == 'ROLE_VENDOR' ? 'bg-warning text-dark' : (u.role.name() == 'ROLE_SHIPPER' ? 'bg-info text-dark' : 'bg-secondary'))}"
                                      th:text="${u.role.name()}">
                                </span>
                            </td>
                            <td>
                                <span th:if="${u.isEmailActive}" class="badge bg-success"><i class="fa-solid fa-check me-1"></i> Đã Kích Hoạt</span>
                                <span th:if="${!u.isEmailActive}" class="badge bg-warning text-dark">Chờ Xác Thực OTP</span>
                            </td>
                            <td><strong class="text-white" th:text="${u.point}"></strong> pts</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
