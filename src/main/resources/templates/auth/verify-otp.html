<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Mã OTP - Duy Truong Moto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: radial-gradient(circle at center, #1b2030 0%, #08090d 100%);">

    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <div class="logo-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 26px;">
                <i class="fa-solid fa-envelope-circle-check"></i>
            </div>
            <h4 class="fw-bold text-white">XÁC THỰC MÃ OTP EMAIL</h4>
            <p class="text-secondary small">Vui lòng nhập mã OTP 6 số đã được gửi tới email của bạn</p>
        </div>

        <div class="glass-panel p-4 p-md-5 rounded-4">
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3 mb-3" th:text="${errorMessage}"></div>
            <div th:if="${infoMessage}" class="alert alert-info py-2 small rounded-3 mb-3" th:text="${infoMessage}"></div>

            <form th:action="@{/auth/verify-otp}" method="post">
                <input type="hidden" name="email" th:value="${email}">

                <div class="mb-4 text-center">
                    <label class="form-label text-secondary small fw-bold mb-2">Mã Xác Thực (6 Chữ Số)</label>
                    <input type="text" name="otp" class="form-control form-control-luxury text-center fs-3 fw-bold tracking-widest text-gold" maxlength="6" placeholder="••••••" required autofocus>
                    <div class="text-secondary small mt-2">Mã có hiệu lực trong vòng 5 phút</div>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-2 fw-bold mb-3">
                    <i class="fa-solid fa-check-circle me-2"></i> KÍCH HOẠT TÀI KHOẢN
                </button>
            </form>

            <div class="border-top border-secondary pt-3 text-center small text-secondary">
                Không nhận được mã? 
                <a th:href="@{/auth/register}" class="text-gold fw-bold text-decoration-none">Đăng ký lại</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
