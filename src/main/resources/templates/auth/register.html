<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản OTP - Duy Truong Motorr</title>
    <!-- Google Fonts: Be Vietnam Pro chuẩn 100% tiếng Việt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page-bg d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 540px;">
        <div class="text-center mb-4">
            <a th:href="@{/home}" class="navbar-brand-logo justify-content-center mb-3 text-decoration-none">
                <div class="logo-icon"><i class="fa-solid fa-motorcycle"></i></div>
                <div>
                    <span class="brand-text text-gradient-gold fw-bold fs-3">DUY TRUONG</span>
                    <span class="brand-text text-white fw-bold fs-3">MOTOR</span>
                </div>
            </a>
            <h3 class="fw-bold text-white mb-1">ĐĂNG KÝ TÀI KHOẢN MỚI</h3>
            <p class="text-light-50 small" style="color: #cbd5e1;">Hệ thống sẽ gửi mã OTP 6 số qua Email để kích hoạt tài khoản an toàn</p>
        </div>

        <div class="auth-card-bright p-4 p-md-5">
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3 mb-3 fw-semibold" th:text="${errorMessage}"></div>

            <form th:action="@{/auth/register}" method="post">
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label">Tên</label>
                        <input type="text" name="firstname" class="form-control form-control-luxury" placeholder="Ví dụ: Trường" required style="border-radius: 12px !important; border-left: 1.5px solid #cbd5e1 !important;">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label">Họ & Tên Đệm</label>
                        <input type="text" name="lastname" class="form-control form-control-luxury" placeholder="Ví dụ: Nguyễn Duy" required style="border-radius: 12px !important; border-left: 1.5px solid #cbd5e1 !important;">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Địa Chỉ Email (Nhận mã OTP)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control form-control-luxury" placeholder="biker@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Số Điện Thoại</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" name="phone" class="form-control form-control-luxury" placeholder="0901234567" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Mật Khẩu (Mã hóa BCrypt)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control form-control-luxury" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-3 fw-bold mb-3 fs-6 shadow-sm">
                    <i class="fa-solid fa-paper-plane me-2"></i> GỬI MÃ OTP KÍCH HOẠT
                </button>
            </form>

            <div class="border-top pt-3 text-center small text-muted">
                Đã có tài khoản thành viên? 
                <a th:href="@{/auth/login}" class="fw-bold text-decoration-none" style="color: #b45309;">Đăng nhập</a>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/home}" class="text-light text-decoration-none small opacity-75">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay về Trang Chủ Duy Truong Motorr
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
