<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Duy Truong Moto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: radial-gradient(circle at center, #1b2030 0%, #08090d 100%);">

    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-white">QUÊN MẬT KHẨU</h4>
            <p class="text-secondary small">Nhập địa chỉ email để nhận mã OTP khôi phục mật khẩu</p>
        </div>

        <div class="glass-panel p-4 p-md-5 rounded-4">
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3 mb-3" th:text="${errorMessage}"></div>

            <form th:action="@{/auth/forgot-password}" method="post">
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">Địa Chỉ Email Đăng Ký</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-gold"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control form-control-luxury" placeholder="name@example.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-2 fw-bold mb-3">GỬI MÃ OTP ĐẶT LẠI MẬT KHẨU</button>
            </form>

            <div class="border-top border-secondary pt-3 text-center small text-secondary">
                <a th:href="@{/auth/login}" class="text-gold text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</body>
</html>
