<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - Duy Truong Moto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: radial-gradient(circle at center, #1b2030 0%, #08090d 100%);">

    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-white">ĐẶT LẠI MẬT KHẨU MỚI</h4>
            <p class="text-secondary small">Nhập mã OTP và mật khẩu mới của bạn</p>
        </div>

        <div class="glass-panel p-4 p-md-5 rounded-4">
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3 mb-3" th:text="${errorMessage}"></div>
            <div th:if="${infoMessage}" class="alert alert-info py-2 small rounded-3 mb-3" th:text="${infoMessage}"></div>

            <form th:action="@{/auth/reset-password}" method="post">
                <input type="hidden" name="email" th:value="${email}">

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Mã OTP (6 Chữ Số)</label>
                    <input type="text" name="otp" class="form-control form-control-luxury text-center fs-4 fw-bold text-gold" maxlength="6" placeholder="••••••" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">Mật Khẩu Mới</label>
                    <input type="password" name="newPassword" class="form-control form-control-luxury" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-2 fw-bold mb-3">LƯU MẬT KHẨU MỚI</button>
            </form>

            <div class="border-top border-secondary pt-3 text-center small text-secondary">
                <a th:href="@{/auth/login}" class="text-gold text-decoration-none">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</body>
</html>
