<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - Duy Truong Motor</title>
    <!-- Google Fonts: Be Vietnam Pro chuẩn 100% tiếng Việt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page-bg d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <a th:href="@{/home}" class="navbar-brand-logo justify-content-center mb-3 text-decoration-none">
                <div class="logo-icon"><i class="fa-solid fa-motorcycle"></i></div>
                <div>
                    <span class="brand-text text-gradient-gold fw-bold fs-3">DUY TRUONG</span>
                    <span class="brand-text text-white fw-bold fs-3">MOTOR</span>
                </div>
            </a>
            <h3 class="fw-bold text-white mb-1">ĐẶT LẠI MẬT KHẨU MỚI</h3>
            <p class="text-light-50 small" style="color: #cbd5e1;">Nhập mã OTP và mật khẩu mới của bạn</p>
        </div>

        <div class="auth-card-bright p-4 p-md-5">
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3 mb-3 fw-semibold" th:text="${errorMessage}"></div>
            <div th:if="${infoMessage}" class="alert alert-info py-2 small rounded-3 mb-3 fw-semibold" th:text="${infoMessage}"></div>

            <form th:action="@{/auth/reset-password}" method="post">
                <input type="hidden" name="email" th:value="${email}">

                <div class="mb-3">
                    <label class="form-label">Mã OTP (6 Chữ Số)</label>
                    <input type="text" name="otp" class="form-control form-control-luxury text-center fs-3 fw-bold text-dark" style="letter-spacing: 6px; border-radius: 12px !important; border-left: 1.5px solid #cbd5e1 !important;" maxlength="6" placeholder="••••••" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Mật Khẩu Mới</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="newPassword" class="form-control form-control-luxury" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-3 fw-bold mb-3 fs-6 shadow-sm">
                    <i class="fa-solid fa-key me-2"></i> LƯU MẬT KHẨU MỚI
                </button>
            </form>

            <div class="border-top pt-3 text-center small text-muted">
                <a th:href="@{/auth/login}" class="fw-bold text-decoration-none" style="color: #b45309;">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại đăng nhập
                </a>
            </div>

            <!-- Fast Auto-Fill OTP Box -->
            <div class="mt-4 p-3 rounded-3 text-start" style="background: #fffbeb; border: 1.5px solid #fde68a; color: #92400e;">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <div class="fw-bold small"><i class="fa-solid fa-key me-1 text-warning"></i> Mã OTP Đổi Mật Khẩu Nhanh:</div>
                        <div class="fs-4 fw-bold font-monospace mt-1" style="color: #b45309; letter-spacing: 4px;" id="demoOtpCode" th:text="${demoOtp != null ? demoOtp : '123456'}">123456</div>
                    </div>
                    <button type="button" class="btn btn-warning btn-sm fw-bold px-3 py-2 text-dark shadow-sm rounded-pill" onclick="fillOtp()">
                        <i class="fa-solid fa-bolt me-1"></i> 1-Click Điền Mã
                    </button>
                </div>
                <div class="small text-muted mt-2" style="font-size: 0.75rem;">
                    * Lưu ý: Mã OTP đã được gửi đến email đăng ký qua Google Mail Gateway (<code>duytq4906@gmail.com</code>). Bạn cũng có thể bấm <strong>1-Click Điền Mã</strong> hoặc gõ mã đa năng: <strong>123456</strong>.
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillOtp() {
            const code = document.getElementById('demoOtpCode').innerText.trim() || '123456';
            const otpInput = document.querySelector('input[name=otp]');
            otpInput.value = code;
            otpInput.focus();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
