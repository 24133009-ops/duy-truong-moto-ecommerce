<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Siêu Mô Tô & Phụ Kiện - Duy Truong Motor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <!-- Breadcrumb & Header -->
        <div class="mb-4">
            <h2 class="fw-bold text-white mb-1">KHO SIÊU MÔ TÔ & PHỤ KIỆN LUXURY</h2>
            <p class="text-secondary small">Tìm kiếm và tinh chỉnh bộ lọc dòng xe theo nhu cầu và ngân sách của bạn</p>
        </div>

        <div class="row g-4">
            <!-- Sidebar Filter -->
            <div class="col-lg-3">
                <div class="glass-panel p-4 rounded-4 sticky-top" style="top: 100px;">
                    <h5 class="fw-bold text-gold mb-3"><i class="fa-solid fa-filter me-2"></i> BỘ LỌC TÌM KIẾM</h5>

                    <form th:action="@{/products}" method="get">
                        <!-- Search Keyword -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Từ khóa</label>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-luxury" placeholder="Tên xe, pô, nón...">
                        </div>

                        <!-- Category -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Danh mục</label>
                            <select name="categoryId" class="form-select form-select-luxury">
                                <option value="">-- Tất cả danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${categoryId != null && categoryId == cat.id}"></option>
                            </select>
                        </div>

                        <!-- Brand -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Hãng xe</label>
                            <select name="brand" class="form-select form-select-luxury">
                                <option value="">-- Tất cả thương hiệu --</option>
                                <option value="Ducati" th:selected="${brand == 'Ducati'}">Ducati</option>
                                <option value="Kawasaki" th:selected="${brand == 'Kawasaki'}">Kawasaki</option>
                                <option value="BMW" th:selected="${brand == 'BMW'}">BMW Motorrad</option>
                                <option value="Harley-Davidson" th:selected="${brand == 'Harley-Davidson'}">Harley-Davidson</option>
                                <option value="Akrapovic" th:selected="${brand == 'Akrapovic'}">Akrapovic</option>
                                <option value="AGV" th:selected="${brand == 'AGV'}">AGV Helmets</option>
                            </select>
                        </div>

                        <!-- Price Range -->
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">Khoảng giá (VNĐ)</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="number" name="minPrice" th:value="${minPrice}" class="form-control form-control-luxury small" placeholder="Từ">
                                </div>
                                <div class="col-6">
                                    <input type="number" name="maxPrice" th:value="${maxPrice}" class="form-control form-control-luxury small" placeholder="Đến">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gold w-100 py-2 fw-bold mb-2">ÁP DỤNG BỘ LỌC</button>
                        <a th:href="@{/products}" class="btn btn-outline-light w-100 py-2 btn-sm">Đặt Lại Bộ Lọc</a>
                    </form>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="text-secondary small">
                        Hiển thị <strong class="text-gold" th:text="${productPage.totalElements}"></strong> sản phẩm phù hợp
                    </div>
                </div>

                <div th:if="${productPage.totalElements == 0}" class="glass-panel p-5 text-center rounded-4">
                    <i class="fa-solid fa-motorcycle text-secondary fs-1 mb-3"></i>
                    <h5 class="text-white">Không tìm thấy sản phẩm nào phù hợp!</h5>
                    <p class="text-secondary small">Vui lòng thử tìm kiếm với từ khóa hoặc mức giá khác</p>
                </div>

                <div class="row g-4" th:if="${productPage.totalElements > 0}">
                    <div class="col-md-6 col-xl-4" th:each="product : ${productPage.content}">
                        <div class="bike-card">
                            <div class="bike-image-wrapper">
                                <img th:src="${product.mainImage}" th:alt="${product.name}">
                                <div class="badge-store-tag">
                                    <i class="fa-solid fa-store text-gold me-1"></i> <span th:text="${product.store.name}"></span>
                                </div>
                            </div>
                            <div class="bike-details">
                                <span class="bike-brand" th:text="${product.brand}"></span>
                                <h4 class="bike-name" th:text="${product.name}"></h4>
                                <div class="text-secondary small mb-3">
                                    <span th:if="${product.engineCapacity}" th:text="${product.engineCapacity} + ' • '"></span>
                                    <span th:text="${product.color}"></span>
                                </div>
                                <div class="mt-auto d-flex justify-content-between align-items-center">
                                    <div class="bike-price" th:text="${#numbers.formatDecimal(product.getEffectivePrice(), 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                                    <a th:href="@{/products/{slug}(slug=${product.slug})}" class="btn btn-gold btn-sm px-3 rounded-pill">Xem Xe</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="mt-5 d-flex justify-content-center" th:if="${productPage.totalPages > 1}">
                    <ul class="pagination pagination-dark gap-2">
                        <li class="page-item" th:classappend="${productPage.first ? 'disabled' : ''}">
                            <a class="page-link bg-dark text-gold border-secondary rounded-3" th:href="@{/products(page=${productPage.number - 1}, keyword=${keyword}, categoryId=${categoryId}, brand=${brand})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}" th:classappend="${productPage.number == i ? 'active' : ''}">
                            <a class="page-link border-secondary rounded-3" th:classappend="${productPage.number == i ? 'bg-gold text-dark fw-bold' : 'bg-dark text-white'}" th:href="@{/products(page=${i}, keyword=${keyword}, categoryId=${categoryId}, brand=${brand})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${productPage.last ? 'disabled' : ''}">
                            <a class="page-link bg-dark text-gold border-secondary rounded-3" th:href="@{/products(page=${productPage.number + 1}, keyword=${keyword}, categoryId=${categoryId}, brand=${brand})}">Sau</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer & Chat Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <div th:replace="~{layout/main :: div.floating-chat-btn}"></div>
    <div th:replace="~{layout/main :: div#liveChatModal}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
