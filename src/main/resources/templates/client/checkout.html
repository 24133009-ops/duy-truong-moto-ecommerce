<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán & Đặt Cọc Xe - Duy Truong Moto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <h2 class="fw-bold text-white mb-4"><i class="fa-solid fa-file-invoice-dollar text-gold me-2"></i> THANH TOÁN & ĐẶT CỌC GIỮ XE</h2>

        <form th:action="@{/checkout/process}" method="post">
            <div class="row g-5">
                <!-- Left: Shipping & Payment Info -->
                <div class="col-lg-7">
                    <!-- Address Info -->
                    <div class="glass-panel p-4 rounded-4 mb-4">
                        <h5 class="fw-bold text-gold mb-3"><i class="fa-solid fa-map-location-dot me-2"></i> THÔNG TIN NHẬN XE & HỢP ĐỒNG</h5>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label text-secondary small fw-bold">Họ và tên người nhận</label>
                                <input type="text" name="recipientName" th:value="${currentUser.getFullName()}" class="form-control form-control-luxury" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-secondary small fw-bold">Số điện thoại liên hệ</label>
                                <input type="tel" name="phone" th:value="${currentUser.phone}" class="form-control form-control-luxury" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Địa chỉ giao nhận xe</label>
                            <input type="text" name="address" class="form-control form-control-luxury" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Ghi chú yêu cầu đặc biệt (tùy chọn)</label>
                            <textarea name="note" rows="2" class="form-control form-control-luxury" placeholder="Ví dụ: Giao xe trước 10h sáng ngày tốt, yêu cầu phủ bạt nhung đen bàn giao..."></textarea>
                        </div>
                    </div>

                    <!-- Delivery Unit Selection -->
                    <div class="glass-panel p-4 rounded-4 mb-4">
                        <h5 class="fw-bold text-gold mb-3"><i class="fa-solid fa-truck-fast me-2"></i> ĐƠN VỊ VẬN CHUYỂN CHUYÊN DỤNG</h5>
                        <div class="d-flex flex-column gap-3">
                            <div class="p-3 bg-black border border-secondary rounded-3 d-flex align-items-center justify-content-between" th:each="deliv, iter : ${deliveries}">
                                <div class="form-check">
                                    <input class="form-check-input bg-dark border-gold" type="radio" name="deliveryId" th:value="${deliv.id}" th:id="'deliv_' + ${deliv.id}" th:checked="${iter.index == 0}">
                                    <label class="form-check-label text-white fw-bold ms-2" th:for="'deliv_' + ${deliv.id}">
                                        <span th:text="${deliv.name}"></span>
                                        <div class="small text-secondary fw-normal" th:text="${deliv.description}"></div>
                                    </label>
                                </div>
                                <div class="text-gold fw-bold text-end" th:text="${#numbers.formatDecimal(deliv.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Method Selection -->
                    <div class="glass-panel p-4 rounded-4">
                        <h5 class="fw-bold text-gold mb-3"><i class="fa-solid fa-wallet me-2"></i> PHƯƠNG THỨC THANH TOÁN</h5>
                        
                        <div class="d-flex flex-column gap-3">
                            <!-- VNPAY Gateway -->
                            <div class="p-3 bg-black border border-gold rounded-3 d-flex align-items-center">
                                <input class="form-check-input bg-dark border-gold" type="radio" name="paymentMethod" value="VNPAY" id="payVnPay" checked>
                                <label class="form-check-label text-white ms-3 d-flex align-items-center gap-3 w-100" for="payVnPay">
                                    <div>
                                        <strong class="text-warning">CỔNG THANH TOÁN VNPAY (QR CODE / THẺ ATM / VISA)</strong>
                                        <div class="small text-secondary">Thanh toán cọc hoặc toàn bộ qua cổng thanh toán bảo mật liên kết ngân hàng</div>
                                    </div>
                                    <span class="badge bg-danger ms-auto">Đề xuất</span>
                                </label>
                            </div>

                            <!-- COD -->
                            <div class="p-3 bg-black border border-secondary rounded-3 d-flex align-items-center">
                                <input class="form-check-input bg-dark border-gold" type="radio" name="paymentMethod" value="COD" id="payCod">
                                <label class="form-check-label text-white ms-3" for="payCod">
                                    <strong>THANH TOÁN TIỀN MẶT KHI BÀN GIAO (COD)</strong>
                                    <div class="small text-secondary">Áp dụng cho đơn hàng đồ chơi xe, nón bảo hiểm hoặc trả phần còn lại khi nhận xe</div>
                                </label>
                            </div>

                            <!-- MOMO -->
                            <div class="p-3 bg-black border border-secondary rounded-3 d-flex align-items-center">
                                <input class="form-check-input bg-dark border-gold" type="radio" name="paymentMethod" value="MOMO" id="payMomo">
                                <label class="form-check-label text-white ms-3" for="payMomo">
                                    <strong>VÍ ĐIỆN TỬ MOMO</strong>
                                    <div class="small text-secondary">Quét mã QR MoMo thanh toán siêu tốc</div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Order summary -->
                <div class="col-lg-5">
                    <div class="glass-panel p-4 rounded-4 sticky-top" style="top: 100px;">
                        <h5 class="fw-bold text-gold mb-3">TÓM TẮT ĐƠN ĐẶT XE</h5>

                        <div class="d-flex flex-column gap-3 mb-4">
                            <div class="d-flex align-items-center justify-content-between pb-2 border-bottom border-secondary" th:each="item : ${cart.items}">
                                <div class="d-flex align-items-center gap-2">
                                    <img th:src="${item.product.mainImage}" class="rounded-2" style="width: 50px; height: 35px; object-fit: cover;">
                                    <div>
                                        <div class="small text-white fw-bold text-truncate" style="max-width: 180px;" th:text="${item.product.name}"></div>
                                        <div class="text-secondary small">SL: <span th:text="${item.count}"></span></div>
                                    </div>
                                </div>
                                <span class="small fw-bold text-gold" th:text="${#numbers.formatDecimal(item.getSubTotal(), 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between text-secondary small mb-2">
                            <span>Tổng phụ kiện & xe:</span>
                            <span class="text-white" th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        </div>
                        <div class="d-flex justify-content-between text-secondary small mb-3">
                            <span>Ưu đãi thành viên:</span>
                            <span class="text-gold fw-bold">Chiết khấu theo UserLevel</span>
                        </div>

                        <div class="border-top border-secondary pt-3 mb-4 d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-white fs-5">Tổng tiền đặt:</span>
                            <span class="fs-4 fw-black text-gradient-gold" th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        </div>

                        <button type="submit" class="btn btn-gold w-100 py-3 fw-bold shadow fs-5">
                            <i class="fa-solid fa-lock me-2"></i> XÁC NHẬN ĐẶT ĐƠN HÀNG
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
