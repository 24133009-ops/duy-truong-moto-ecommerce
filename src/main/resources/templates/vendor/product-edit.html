<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Sản Phẩm - Duy Truong Motor Vendor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5" style="max-width: 900px;">
        <div class="mb-4">
            <a th:href="@{/vendor/products}" class="text-gold text-decoration-none small d-inline-block mb-2">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Danh Sách Sản Phẩm
            </a>
            <h3 class="fw-bold text-white mb-1"><i class="fa-solid fa-pen-to-square text-gold me-2"></i> CHỈNH SỬA THÔNG TIN SẢN PHẨM</h3>
            <p class="text-secondary small">Cập nhật giá bán, số lượng tồn kho và thông số kỹ thuật xe / phụ tùng bảo hộ.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show bg-danger text-white border-0 rounded-4 shadow">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <div class="glass-panel p-4 p-md-5 rounded-4 shadow-lg">
            <form th:action="@{'/vendor/products/' + ${product.id} + '/edit'}" method="post" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label text-light small fw-bold">Tên Dòng Xe / Trang Bị Bảo Hộ</label>
                    <input type="text" name="name" class="form-control form-control-luxury" th:value="${product.name}" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label text-light small fw-bold">Đường Dẫn Tĩnh (Slug)</label>
                        <input type="text" name="slug" class="form-control form-control-luxury" th:value="${product.slug}" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label text-light small fw-bold">Phân Loại Danh Mục</label>
                        <select name="categoryId" class="form-select form-select-luxury" required>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == product.category.id}"></option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-4">
                        <label class="form-label text-light small fw-bold">Hãng Xe / Nhà Sản Xuất</label>
                        <select name="brand" class="form-select form-select-luxury" required>
                            <option value="KTM" th:selected="${product.brand == 'KTM'}">KTM (Áo)</option>
                            <option value="Ducati" th:selected="${product.brand == 'Ducati'}">Ducati (Ý)</option>
                            <option value="Kawasaki" th:selected="${product.brand == 'Kawasaki'}">Kawasaki (Nhật Bản)</option>
                            <option value="BMW Motorrad" th:selected="${product.brand == 'BMW Motorrad'}">BMW Motorrad (Đức)</option>
                            <option value="Honda" th:selected="${product.brand == 'Honda'}">Honda</option>
                            <option value="Yamaha" th:selected="${product.brand == 'Yamaha'}">Yamaha</option>
                            <option value="Harley-Davidson" th:selected="${product.brand == 'Harley-Davidson'}">Harley-Davidson (Mỹ)</option>
                            <option value="Husqvarna" th:selected="${product.brand == 'Husqvarna'}">Husqvarna (Thụy Điển)</option>
                            <option value="AGV Helmets" th:selected="${product.brand == 'AGV Helmets'}">AGV Helmets</option>
                            <option value="Dainese" th:selected="${product.brand == 'Dainese'}">Dainese Racing Gear</option>
                            <option value="Alpinestars" th:selected="${product.brand == 'Alpinestars'}">Alpinestars</option>
                            <option value="Akrapovic" th:selected="${product.brand == 'Akrapovic'}">Akrapovic Exhaust</option>
                            <option value="SC-Project" th:selected="${product.brand == 'SC-Project'}">SC-Project WorldSBK</option>
                            <option value="Ohlins" th:selected="${product.brand == 'Ohlins'}">Ohlins Suspension</option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label text-light small fw-bold">Dung Tích Động Cơ</label>
                        <input type="text" name="engineCapacity" class="form-control form-control-luxury" th:value="${product.engineCapacity}">
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label text-light small fw-bold">Màu Sơn / Ngoại Thất</label>
                        <input type="text" name="color" class="form-control form-control-luxury" th:value="${product.color}" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-4">
                        <label class="form-label text-light small fw-bold">Giá Bán Niêm Yết (VNĐ)</label>
                        <input type="number" name="price" class="form-control form-control-luxury fw-bold text-gold" th:value="${product.price}" required>
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label text-light small fw-bold">Giá Khuyến Mãi (Nếu có)</label>
                        <input type="number" name="promotionalPrice" class="form-control form-control-luxury" th:value="${product.promotionalPrice}">
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label text-light small fw-bold">Số Lượng Tồn Kho Tại Showroom</label>
                        <input type="number" name="quantity" th:value="${product.quantity}" min="0" class="form-control form-control-luxury" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label text-light small fw-bold">Hình Ảnh Hiện Tại</label>
                        <div class="d-flex align-items-center gap-3">
                            <img th:src="${product.mainImage}" class="rounded-3 border border-secondary" style="width: 80px; height: 60px; object-fit: cover;">
                            <span class="text-secondary small">Để trống ô bên cạnh nếu muốn giữ nguyên ảnh này.</span>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label text-light small fw-bold">Thay Đổi Ảnh Mới (Tùy chọn)</label>
                        <input type="file" name="imageFile" class="form-control form-control-luxury" accept="image/png, image/jpeg, image/webp">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light small fw-bold">Mô Tả Chi Tiết & Tình Trạng Xe</label>
                    <textarea name="description" rows="5" class="form-control form-control-luxury" th:text="${product.description}" required></textarea>
                </div>

                <div class="d-flex justify-content-end gap-3 pt-3 border-top border-secondary">
                    <a th:href="@{/vendor/products}" class="btn btn-outline-secondary px-4 py-2">Hủy Bỏ</a>
                    <button type="submit" class="btn btn-gold px-4 py-2 fw-bold">
                        <i class="fa-solid fa-save me-1"></i> Lưu Cập Nhật
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
