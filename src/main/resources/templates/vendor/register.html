<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Mở Showroom - Duy Truong Motor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: radial-gradient(circle at center, #1b2030 0%, #08090d 100%);">

    <div class="container" style="max-width: 650px;">
        <div class="text-center mb-4">
            <div class="logo-icon mx-auto mb-3" style="width: 55px; height: 55px; font-size: 28px;">
                <i class="fa-solid fa-store"></i>
            </div>
            <h4 class="fw-bold text-white">ĐĂNG KÝ GIA NHẬP CHUỖI SHOWROOM DUY TRUONG MOTOR</h4>
            <p class="text-secondary small">Trở thành đối tác ủy quyền hoặc mở chi nhánh showroom phân phối siêu môtô</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3 mb-3" th:text="${errorMessage}"></div>

        <div class="glass-panel p-4 p-md-5 rounded-4">
            <form th:action="@{/vendor/register}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Tên Chi Nhánh Showroom</label>
                    <input type="text" name="name" class="form-control form-control-luxury" placeholder="Ví dụ: Duy Truong Motor Showroom Hải Phòng" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Đường dẫn Showroom (Slug)</label>
                    <input type="text" name="slug" class="form-control form-control-luxury" placeholder="duy-truong-moto-hai-phong" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label text-secondary small fw-bold">Hotline Showroom</label>
                        <input type="tel" name="phone" class="form-control form-control-luxury" placeholder="0901234567" required>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label text-secondary small fw-bold">Gói Chiết Khấu Sàn (Commission)</label>
                        <select name="commissionId" class="form-select form-select-luxury" required>
                            <option th:each="c : ${commissions}" th:value="${c.id}" th:text="${c.name} + ' (' + ${c.cost} + '%)'"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Địa Chỉ Mặt Bằng Showroom</label>
                    <input type="text" name="address" class="form-control form-control-luxury" placeholder="Số nhà, phố, quận/huyện, thành phố..." required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold">Giới Thiệu Showroom & Năng Lực Trưng Bày</label>
                    <textarea name="bio" rows="3" class="form-control form-control-luxury" placeholder="Mô tả cơ sở vật chất, phòng trưng bày, xưởng dịch vụ kỹ thuật..." required></textarea>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-3 fw-bold shadow">
                    <i class="fa-solid fa-file-signature me-2"></i> GỬI HỒ SƠ ĐĂNG KÝ SHOWROOM
                </button>
            </form>

            <div class="border-top border-secondary pt-3 text-center small text-secondary mt-3">
                <a th:href="@{/home}" class="text-gold text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay về Trang Chủ</a>
            </div>
        </div>
    </div>

</body>
</html>
