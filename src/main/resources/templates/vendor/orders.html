<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng Showroom - Duy Truong Motor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261028_final')}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: topbar}"></div>
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/vendor/dashboard}" class="text-gold text-decoration-none small d-inline-block mb-1"><i class="fa-solid fa-arrow-left me-1"></i> Trở về Dashboard Showroom</a>
                <h3 class="fw-bold text-white mb-0"><i class="fa-solid fa-clipboard-check text-gold me-2"></i> QUẢN LÝ ĐƠN ĐẶT HÀNG & BÀN GIAO XE</h3>
            </div>
        </div>

        <!-- Alert Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show bg-success text-white border-0 rounded-4 shadow">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <!-- Status Filter Tabs -->
        <div class="d-flex flex-wrap gap-2 mb-4 pb-2 border-bottom border-secondary">
            <a th:href="@{/vendor/orders}" class="btn btn-sm rounded-pill" th:classappend="${currentStatus == null ? 'btn-gold' : 'btn-dark border-secondary text-secondary'}">Tất Cả Đơn</a>
            <a th:each="st : ${statuses}" th:href="@{/vendor/orders(status=${st})}" class="btn btn-sm rounded-pill" th:classappend="${currentStatus == st ? 'btn-gold' : 'btn-dark border-secondary text-secondary'}" th:text="${st.displayName}"></a>
        </div>

        <div class="glass-panel p-4 rounded-4">
            <div class="table-responsive">
                <table class="table table-dark table-borderless align-middle mb-0">
                    <thead>
                        <tr class="border-bottom border-secondary text-gold small">
                            <th>MÃ ĐƠN</th>
                            <th>NGÀY ĐẶT</th>
                            <th>KHÁCH HÀNG</th>
                            <th>ĐỊA CHỈ NHẬN XE</th>
                            <th>THỰC THU SHOWROOM</th>
                            <th>TRẠNG THÁI HIỆN TẠI</th>
                            <th>CẬP NHẬT TRẠNG THÁI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-bottom border-secondary" th:each="order : ${orders}">
                            <td><strong class="text-gold" th:text="${order.orderCode}"></strong></td>
                            <td class="text-secondary small" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <strong class="text-white" th:text="${order.recipientName}"></strong>
                                <div class="text-secondary small" th:text="${order.phone}"></div>
                            </td>
                            <td class="text-secondary small" style="max-width: 200px;" th:text="${order.address}"></td>
                            <td class="fw-bold text-gradient-gold" th:text="${order.amountToStore != null ? #numbers.formatDecimal(order.amountToStore, 0, 'POINT', 0, 'COMMA') + ' đ' : '0 đ'}"></td>
                            <td th:with="stName=${order.status != null ? order.status.name() : ''}, stepIdx=${stName == 'NOT_PROCESSED' ? 1 : (stName == 'CONFIRMED' ? 2 : (stName == 'PICKED_UP' ? 3 : (stName == 'SHIPPING' ? 4 : (stName == 'DELIVERED' ? 6 : 0))))}">
                                <div class="badge bg-gold text-dark fw-bold small mb-1" th:if="${stName != 'CANCELLED' and stName != 'REFUNDED'}">
                                    <i class="fa-solid fa-truck-fast me-1"></i> Chặng ${stepIdx}/6
                                </div>
                                <div>
                                    <span class="badge badge-status"
                                          th:classappend="${order.status != null and order.status.name() == 'NOT_PROCESSED' ? 'badge-status-new' : (order.status != null and order.status.name() == 'DELIVERED' ? 'badge-status-delivered' : 'badge-status-confirmed')}"
                                          th:text="${order.status != null ? order.status.displayName : 'Đang xử lý'}">
                                    </span>
                                </div>
                            </td>
                            <td>
                                <form th:action="@{/vendor/orders/{id}/status(id=${order.id})}" method="post" class="d-flex align-items-center gap-1">
                                    <select name="status" class="form-select form-select-sm form-select-luxury" style="font-size: 0.75rem;">
                                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}" th:selected="${order.status == st}"></option>
                                    </select>
                                    <button type="submit" class="btn btn-gold btn-sm px-2 py-1" style="font-size: 0.75rem;">Lưu</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
