<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kho Xe Showroom - Duy Truong Moto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header / Navbar Include -->
    <div th:replace="~{layout/main :: nav}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/vendor/dashboard}" class="text-gold text-decoration-none small d-inline-block mb-1"><i class="fa-solid fa-arrow-left me-1"></i> Trở về Dashboard Showroom</a>
                <h3 class="fw-bold text-white mb-0"><i class="fa-solid fa-motorcycle text-gold me-2"></i> QUẢN LÝ KHO XE & PHỤ TÙNG CỦA SHOWROOM</h3>
            </div>
            <a th:href="@{/vendor/products/new}" class="btn btn-gold btn-sm px-3 shadow"><i class="fa-solid fa-plus me-1"></i> Thêm Dòng Xe Mới</a>
        </div>

        <!-- Alert Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show bg-success text-white border-0 rounded-4 shadow">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <div class="glass-panel p-4 rounded-4">
            <div class="table-responsive">
                <table class="table table-dark table-borderless align-middle mb-0">
                    <thead>
                        <tr class="border-bottom border-secondary text-secondary small">
                            <th>HÌNH ẢNH</th>
                            <th>TÊN XE / PHỤ TÙNG</th>
                            <th>HÃNG</th>
                            <th>GIÁ BÁN</th>
                            <th>TỒN KHO</th>
                            <th>ĐÃ BÁN</th>
                            <th>TRẠNG THÁI BÁN</th>
                            <th>THAO TÁC</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-bottom border-secondary" th:each="product : ${products}">
                            <td>
                                <img th:src="${product.mainImage}" class="rounded-3 shadow" style="width: 75px; height: 50px; object-fit: cover;">
                            </td>
                            <td>
                                <strong class="text-white" th:text="${product.name}"></strong>
                                <div class="text-secondary small" th:text="${product.engineCapacity != null ? product.engineCapacity : 'Phụ tùng'}"></div>
                            </td>
                            <td><span class="badge bg-dark border border-secondary text-gold" th:text="${product.brand}"></span></td>
                            <td class="fw-bold text-gradient-gold" th:text="${#numbers.formatDecimal(product.getEffectivePrice(), 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td><span class="badge bg-success" th:text="${product.quantity} + ' chiếc'"></span></td>
                            <td><strong class="text-danger" th:text="${product.sold}"></strong></td>
                            <td>
                                <span th:if="${product.isSelling}" class="badge bg-success">Đang mở bán</span>
                                <span th:if="${!product.isSelling}" class="badge bg-secondary">Tạm ngừng bán</span>
                            </td>
                            <td>
                                <form th:action="@{/vendor/products/{id}/toggle(id=${product.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-warning btn-sm p-1" th:title="${product.isSelling ? 'Ngừng bán' : 'Mở bán lại'}">
                                        <i class="fa-solid fa-power-off"></i>
                                    </button>
                                </form>
                                <a th:href="@{/products/{slug}(slug=${product.slug})}" target="_blank" class="btn btn-outline-info btn-sm p-1" title="Xem trên web">
                                    <i class="fa-solid fa-eye"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer Include -->
    <div th:replace="~{layout/main :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
