spring.application.name=duy-truong-moto
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIGURATION (Tự động thích ứng PostgreSQL / SQL Server / H2 In-Memory)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:duytruongdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===============================
# SPRING SECURITY & JWT
# ===============================
duytruongmoto.jwt.secret=${JWT_SECRET:9a6747f3a1824a748c9a3b952f82f7b49a6747f3a1824a748c9a3b952f82f7b4}
duytruongmoto.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:duytruongmoto}
cloudinary.api_key=${CLOUDINARY_API_KEY:123456789012345}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:abcdefghijklmnopqrstuvwxyz12345}

# ===============================
# VNPAY PAYMENT GATEWAY
# ===============================
vnpay.tmn_code=${VNPAY_TMN_CODE:DUYTRUONG}
vnpay.hash_secret=${VNPAY_HASH_SECRET:ABCDEFGHIJKLMN1234567890OPQRSTUVWXYZ}
vnpay.payment_url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return_url=${VNPAY_RETURN_URL:http://localhost:8080/checkout/vnpay-return}

# ===============================
# MAIL CONFIGURATION (GMAIL SMTP LIVE GATEWAY)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:duytq4906@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:lnxgxrhmotbwdpmp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
