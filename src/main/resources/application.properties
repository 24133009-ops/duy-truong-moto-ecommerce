spring.application.name=duy-truong-moto
server.port=8080

# ===============================
# DATABASE CONFIGURATION (Tự động thích ứng SQL Server / PostgreSQL / MySQL)
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DuyTruongMotoDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=duytruong_admin
spring.datasource.password=Password123@

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===============================
# SPRING SECURITY & JWT
# ===============================
duytruongmoto.jwt.secret=9a6747f3a1824a748c9a3b952f82f7b49a6747f3a1824a748c9a3b952f82f7b4
duytruongmoto.jwt.expiration=86400000

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud_name=duytruongmoto
cloudinary.api_key=123456789012345
cloudinary.api_secret=abcdefghijklmnopqrstuvwxyz12345

# ===============================
# VNPAY PAYMENT GATEWAY
# ===============================
vnpay.tmn_code=DUYTRUONG
vnpay.hash_secret=ABCDEFGHIJKLMN1234567890OPQRSTUVWXYZ
vnpay.payment_url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return_url=http://localhost:8080/checkout/vnpay-return

# ===============================
# MAIL CONFIGURATION (GMAIL SMTP / MOCK)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply.duytruongmoto@gmail.com
spring.mail.password=your_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
