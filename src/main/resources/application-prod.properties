# ==============================================================
# DUY TRUONG MOTO - PRODUCTION PROFILE (application-prod.properties)
# Bảo mật hệ thống: Ẩn hoàn toàn Stack Trace & Lỗi kỹ thuật
# ==============================================================

# 1. BẢO MẬT HIỂN THỊ LỖI (CHỐNG LỘ CÔNG NGHỆ & TRACEBACK)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# 2. LOGGING CHUẨN PRODUCTION
logging.level.root=INFO
logging.level.com.duytruongmoto=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# 3. TẮT CÁC CÔNG CỤ DEBUG
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

